const WORK_STATUS_COLOR = {
  "Selesai": "#0F766E",
  "Sedang Bekerja": "#2563EB",
  "Belum Absen": "#E11D48",
  "Libur": "#94A3B8",
  "Cuti": "#7C3AED",
  "Izin": "#F59E0B",
};

function exportWorkReportPDF(ctx, start, end, periodLabel) {
  const { schedules, attendance, settings } = ctx;
  const daysInRange = [];
  let d = new Date(start);
  while (d <= end) { daysInRange.push(toISO(d)); d = addDays(d, 1); }

  const dayComputes = daysInRange.map((iso) => computeDay(iso, schedules, attendance, settings));
  const workDays = dayComputes.filter((x) => x.att && x.att.checkIn && x.att.checkOut);
  const totalWorkMinutes = workDays.reduce((s, x) => s + x.regularMinutes, 0);
  const totalOvertimeMinutes = workDays.reduce((s, x) => s + x.overtimeMinutes, 0);
  const lateCount = dayComputes.filter((x) => x.checkInDelta > 0).length;
  const holidayCount = dayComputes.filter((x) => x.sched && x.sched.status !== "Kerja").length;
  const totalIncomeWork = workDays.reduce((s, x) => s + x.totalPay, 0);
  const relevantDays = dayComputes.filter((x) => x.att || (x.sched && x.sched.status !== "Kerja"));

  const rows = relevantDays.map((x) => {
    const dt = parseISO(x.iso);
    const color = WORK_STATUS_COLOR[x.status] || "#66707F";
    const inDelta = x.checkInDelta != null ? deltaLabel(x.checkInDelta, "in") : null;
    return `<tr>
      <td>${DAYS_SHORT[dt.getDay()]}, ${formatDateID(dt)}</td>
      <td><span class="badge" style="background:${color}">${escapeHtml(x.status)}</span></td>
      <td>${x.att && x.att.checkIn ? escapeHtml(x.att.checkIn) : "-"}</td>
      <td>${x.att && x.att.checkOut ? escapeHtml(x.att.checkOut) : "-"}</td>
      <td class="num">${x.workedMinutes != null ? minutesToDur(x.regularMinutes) : "-"}</td>
      <td class="num">${x.overtimeMinutes ? minutesToDur(x.overtimeMinutes) : "-"}</td>
      <td>${inDelta || "-"}</td>
      <td class="num" style="font-weight:700;">${x.totalPay ? formatRupiah(x.totalPay) : "-"}</td>
    </tr>`;
  }).join("");

  const html = `<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8" />
<title>Laporan Absensi &amp; Kerja - ${escapeHtml(periodLabel)}</title>
<style>${PDF_BASE_STYLE}</style>
</head><body>
${pdfToolbar()}
<div class="sheet">
  ${pdfHeader("Laporan Absensi & Kerja", periodLabel, settings)}
  <div class="meta-strip">
    <div>Tipe Penggajian: <b>${escapeHtml(settings.payType === "hourly" ? "Per Jam" : settings.payType === "daily" ? "Per Hari" : settings.payType === "shift" ? "Per Shift" : "Bulanan")}</b></div>
    <div>Tarif Kerja: <b>${formatRupiah(settings.normalRate)}</b></div>
    <div>Tarif Lembur: <b>${formatRupiah(settings.overtimeRate)}</b></div>
  </div>

  <h2 class="section">Ringkasan Kerja</h2>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Total Hari Kerja</div><div class="stat-value">${workDays.length} hari</div></div>
    <div class="stat-card"><div class="stat-label">Total Jam Kerja</div><div class="stat-value">${minutesToDur(totalWorkMinutes)}</div></div>
    <div class="stat-card"><div class="stat-label">Total Jam Lembur</div><div class="stat-value">${minutesToDur(totalOvertimeMinutes)}</div></div>
    <div class="stat-card"><div class="stat-label">Jumlah Keterlambatan</div><div class="stat-value">${lateCount} kali</div></div>
    <div class="stat-card"><div class="stat-label">Jumlah Hari Libur/Cuti/Izin</div><div class="stat-value">${holidayCount} hari</div></div>
    <div class="stat-card"><div class="stat-label">Total Pendapatan Kerja</div><div class="stat-value pos">${formatRupiah(totalIncomeWork)}</div></div>
  </div>

  <h2 class="section">Detail Absensi Harian</h2>
  ${relevantDays.length === 0 ? `<div class="empty-note">Tidak ada data absensi pada periode ini.</div>` : `
  <table>
    <thead><tr>
      <th>Tanggal</th><th>Status</th><th>Masuk</th><th>Pulang</th>
      <th class="num">Jam Kerja</th><th class="num">Lembur</th><th>Keterlambatan</th><th class="num">Pendapatan</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`}

  ${pdfFooter("Laporan Absensi & Kerja")}
</div>
</body></html>`;

  openReportWindow(html);
}

function exportFinanceReportPDF(ctx, start, end, periodLabel) {
  const { transactions, savings, settings } = ctx;
  const startISO = toISO(start), endISO = toISO(end);
  const rangeTx = transactions.filter((t) => t.date >= startISO && t.date <= endISO).sort((a, b) => a.date.localeCompare(b.date));
  const totalIncome = rangeTx.filter((t) => t.type === "income").reduce((s, t) => s + t.amount, 0);
  const totalExpense = rangeTx.filter((t) => t.type === "expense").reduce((s, t) => s + t.amount, 0);
  const totalSavings = savings.reduce((s, g) => s + g.saved, 0);
  const balance = transactions.reduce((s, t) => s + (t.type === "income" ? t.amount : -t.amount), 0);

  const expenseByCategory = EXPENSE_CATEGORIES.map((cat) => ({
    name: cat, value: rangeTx.filter((t) => t.type === "expense" && t.category === cat).reduce((s, t) => s + t.amount, 0),
  })).filter((c) => c.value > 0).sort((a, b) => b.value - a.value);
  const totalExpenseForPct = expenseByCategory.reduce((s, c) => s + c.value, 0) || 1;

  const biggestExpense = rangeTx.filter((t) => t.type === "expense").sort((a, b) => b.amount - a.amount)[0];
  const biggestCategory = expenseByCategory[0];

  const catRows = expenseByCategory.map((c) => `<tr>
      <td>${escapeHtml(c.name)}</td>
      <td class="num">${formatRupiah(c.value)}</td>
      <td class="num">${((c.value / totalExpenseForPct) * 100).toFixed(1)}%</td>
    </tr>`).join("");

  const txRows = rangeTx.map((t) => {
    const dt = parseISO(t.date);
    const isIncome = t.type === "income";
    return `<tr>
      <td>${formatDateID(dt)}</td>
      <td>${escapeHtml(t.name || "-")}</td>
      <td>${escapeHtml(t.category || "-")}</td>
      <td><span class="badge" style="background:${isIncome ? "#15803D" : "#E11D48"}">${isIncome ? "Pemasukan" : "Pengeluaran"}</span></td>
      <td class="num" style="font-weight:700;color:${isIncome ? "#15803D" : "#E11D48"};">${isIncome ? "+" : "-"}${formatRupiah(t.amount)}</td>
    </tr>`;
  }).join("");

  const html = `<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8" />
<title>Laporan Keuangan - ${escapeHtml(periodLabel)}</title>
<style>${PDF_BASE_STYLE}</style>
</head><body>
${pdfToolbar()}
<div class="sheet">
  ${pdfHeader("Laporan Keuangan", periodLabel, settings)}

  <h2 class="section">Ringkasan Keuangan</h2>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Total Pemasukan</div><div class="stat-value pos">${formatRupiah(totalIncome)}</div></div>
    <div class="stat-card"><div class="stat-label">Total Pengeluaran</div><div class="stat-value neg">${formatRupiah(totalExpense)}</div></div>
    <div class="stat-card"><div class="stat-label">Total Tabungan</div><div class="stat-value">${formatRupiah(totalSavings)}</div></div>
    <div class="stat-card"><div class="stat-label">Saldo Keseluruhan</div><div class="stat-value ${balance >= 0 ? "pos" : "neg"}">${formatRupiah(balance)}</div></div>
    <div class="stat-card"><div class="stat-label">Pengeluaran Terbesar</div><div class="stat-value" style="font-size:12.5px;">${biggestExpense ? `${escapeHtml(biggestExpense.name)} · ${formatRupiah(biggestExpense.amount)}` : "-"}</div></div>
    <div class="stat-card"><div class="stat-label">Kategori Terbesar</div><div class="stat-value" style="font-size:12.5px;">${biggestCategory ? `${escapeHtml(biggestCategory.name)} · ${formatRupiah(biggestCategory.value)}` : "-"}</div></div>
  </div>

  <h2 class="section">Pengeluaran per Kategori</h2>
  ${expenseByCategory.length === 0 ? `<div class="empty-note">Tidak ada pengeluaran pada periode ini.</div>` : `
  <table>
    <thead><tr><th>Kategori</th><th class="num">Jumlah</th><th class="num">Persentase</th></tr></thead>
    <tbody>${catRows}</tbody>
  </table>`}

  <h2 class="section">Detail Transaksi</h2>
  ${rangeTx.length === 0 ? `<div class="empty-note">Tidak ada transaksi pada periode ini.</div>` : `
  <table>
    <thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Tipe</th><th class="num">Jumlah</th></tr></thead>
    <tbody>${txRows}</tbody>
  </table>`}

  ${pdfFooter("Laporan Keuangan")}
</div>
</body></html>`;

  openReportWindow(html);
}

function ReportsPage({ ctx }) {
  const { theme, schedules, attendance, settings, transactions, savings, now } = ctx;
  const [range, setRange] = useState("month");
  const [customStart, setCustomStart] = useState(toISO(startOfMonth(now)));
  const [customEnd, setCustomEnd] = useState(toISO(now));

  const { start, end } = useMemo(() => {
    if (range === "week") return { start: startOfWeek(now), end: addDays(startOfWeek(now), 6) };
    if (range === "month") return { start: startOfMonth(now), end: endOfMonth(now) };
    if (range === "year") return { start: new Date(now.getFullYear(), 0, 1), end: new Date(now.getFullYear(), 11, 31) };
    return { start: parseISO(customStart), end: parseISO(customEnd) };
  }, [range, now, customStart, customEnd]);

  const daysInRange = useMemo(() => {
    const arr = [];
    let d = new Date(start);
    while (d <= end) { arr.push(toISO(d)); d = addDays(d, 1); }
    return arr;
  }, [start, end]);

  const dayComputes = daysInRange.map((iso) => computeDay(iso, schedules, attendance, settings));
  const workDays = dayComputes.filter((d) => d.att?.checkIn && d.att?.checkOut);
  const totalWorkMinutes = workDays.reduce((s, d) => s + d.regularMinutes, 0);
  const totalOvertimeMinutes = workDays.reduce((s, d) => s + d.overtimeMinutes, 0);
  const lateCount = dayComputes.filter((d) => d.checkInDelta > 0).length;
  const holidayCount = dayComputes.filter((d) => d.sched && d.sched.status !== "Kerja").length;
  const totalIncomeWork = workDays.reduce((s, d) => s + d.totalPay, 0);

  const rangeTx = transactions.filter((t) => t.date >= toISO(start) && t.date <= toISO(end));
  const totalIncome = rangeTx.filter((t) => t.type === "income").reduce((s, t) => s + t.amount, 0);
  const totalExpense = rangeTx.filter((t) => t.type === "expense").reduce((s, t) => s + t.amount, 0);
  const totalSavings = savings.reduce((s, g) => s + g.saved, 0);
  const balance = transactions.reduce((s, t) => s + (t.type === "income" ? t.amount : -t.amount), 0);

  const expenseByCategory = EXPENSE_CATEGORIES.map((cat) => ({
    name: cat, value: rangeTx.filter((t) => t.type === "expense" && t.category === cat).reduce((s, t) => s + t.amount, 0),
  })).filter((c) => c.value > 0);

  const biggestExpense = rangeTx.filter((t) => t.type === "expense").sort((a, b) => b.amount - a.amount)[0];
  const biggestCategory = [...expenseByCategory].sort((a, b) => b.value - a.value)[0];

  const PIE_COLORS = [theme.brand, theme.amber, theme.rose, theme.green, "#818CF8", "#F472B6", "#38BDF8", "#FB923C", theme.textMuted];

  const periodLabel = `${formatDateID(start)} — ${formatDateID(end)}`;

  return (
    <div>
      <SectionTitle theme={theme}>Laporan</SectionTitle>
      <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
        {[["week", "Minggu"], ["month", "Bulan"], ["year", "Tahun"], ["custom", "Custom"]].map(([k, l]) => (
          <button key={k} onClick={() => setRange(k)} style={{
            padding: "7px 12px", borderRadius: 999, border: `1px solid ${theme.border}`,
            background: range === k ? theme.brand : theme.surface, color: range === k ? "#04201D" : theme.text,
            fontWeight: 700, fontSize: 12, cursor: "pointer",
          }}>{l}</button>
        ))}
      </div>
      {range === "custom" && (
        <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
          <TextInput theme={theme} type="date" value={customStart} onChange={(e) => setCustomStart(e.target.value)} />
          <TextInput theme={theme} type="date" value={customEnd} onChange={(e) => setCustomEnd(e.target.value)} />
        </div>
      )}

      <SectionTitle theme={theme}>Work Report</SectionTitle>
      <Card theme={theme}>
        <Row theme={theme} label="Total Hari Kerja" value={`${workDays.length} hari`} />
        <Row theme={theme} label="Total Jam Kerja" value={minutesToDur(totalWorkMinutes)} />
        <Row theme={theme} label="Total Jam Lembur" value={minutesToDur(totalOvertimeMinutes)} />
        <Row theme={theme} label="Jumlah Keterlambatan" value={`${lateCount} kali`} />
        <Row theme={theme} label="Jumlah Hari Libur" value={`${holidayCount} hari`} />
        <Row theme={theme} label="Total Penghasilan" value={formatRupiah(totalIncomeWork)} bold />
      </Card>
      <Button theme={theme} variant="outline" onClick={() => exportWorkReportPDF(ctx, start, end, periodLabel)} style={{ width: "100%", marginTop: 10 }}>
        <Icon name="download" size={15} /> Export Laporan Kerja (PDF)
      </Button>

      <SectionTitle theme={theme}>Finance Report</SectionTitle>
      <Card theme={theme}>
        <Row theme={theme} label="Total Pemasukan" value={formatRupiah(totalIncome)} />
        <Row theme={theme} label="Total Pengeluaran" value={formatRupiah(totalExpense)} />
        <Row theme={theme} label="Total Tabungan" value={formatRupiah(totalSavings)} />
        <Row theme={theme} label="Saldo" value={formatRupiah(balance)} bold />
        <Row theme={theme} label="Pengeluaran Terbesar" value={biggestExpense ? `${biggestExpense.name} · ${formatRupiah(biggestExpense.amount)}` : "-"} />
        <Row theme={theme} label="Kategori Terbesar" value={biggestCategory ? `${biggestCategory.name} · ${formatRupiah(biggestCategory.value)}` : "-"} />
      </Card>
      <Button theme={theme} variant="outline" onClick={() => exportFinanceReportPDF(ctx, start, end, periodLabel)} style={{ width: "100%", marginTop: 10 }}>
        <Icon name="download" size={15} /> Export Laporan Keuangan (PDF)
      </Button>

      {expenseByCategory.length > 0 && (
        <>
          <SectionTitle theme={theme}>Pengeluaran per Kategori</SectionTitle>
          <Card theme={theme}>
            <SimplePieChart theme={theme} data={expenseByCategory} colors={PIE_COLORS} size={180} />
          </Card>
        </>
      )}
    </div>
  );
}

/* ============================== SETTINGS PAGE ============================== */

function SettingsPage({ ctx }) {
  const { theme, settings, setSettings, schedules, attendance, transactions, budgets, savings } = ctx;
  const [showExport, setShowExport] = useState(false);
  const [importText, setImportText] = useState("");
  const [showImport, setShowImport] = useState(false);

  const toggleWorkDay = (dow) => {
    const days = settings.defaultWorkDays.includes(dow) ? settings.defaultWorkDays.filter((d) => d !== dow) : [...settings.defaultWorkDays, dow];
    setSettings({ ...settings, defaultWorkDays: days });
  };

  const exportData = JSON.stringify({ settings, schedules, attendance, transactions, budgets, savings }, null, 2);

  const applyImport = () => {
    try {
      const data = JSON.parse(importText);
      if (data.settings) ctx.setSettings(data.settings);
      if (data.schedules) ctx.setSchedules(data.schedules);
      if (data.attendance) ctx.setAttendance(data.attendance);
      if (data.transactions) ctx.setTransactions(data.transactions);
      if (data.budgets) ctx.setBudgets(data.budgets);
      if (data.savings) ctx.setSavings(data.savings);
      setShowImport(false);
      setImportText("");
    } catch (e) {
      alert("Format JSON tidak valid.");
    }
  };

  return (
    <div>
      <SectionTitle theme={theme}>Profil</SectionTitle>
      <Card theme={theme}>
        <Field theme={theme} label="Nama Pengguna"><TextInput theme={theme} value={settings.name} onChange={(e) => setSettings({ ...settings, name: e.target.value })} /></Field>
        <Field theme={theme} label="Mata Uang"><TextInput theme={theme} value={settings.currency} onChange={(e) => setSettings({ ...settings, currency: e.target.value })} /></Field>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
          <span style={{ fontSize: 13, fontWeight: 600 }}>Mode Gelap</span>
          <Button theme={theme} variant="outline" onClick={() => setSettings({ ...settings, darkMode: !settings.darkMode })}><Icon name={settings.darkMode ? "sun" : "moon"} size={15} /> {settings.darkMode ? "Aktif" : "Nonaktif"}</Button>
        </div>
      </Card>

      <SectionTitle theme={theme}>Default Jadwal Kerja</SectionTitle>
      <Card theme={theme}>
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1 }}><Field theme={theme} label="Jam Masuk Default"><TextInput theme={theme} type="time" value={settings.defaultStart} onChange={(e) => setSettings({ ...settings, defaultStart: e.target.value })} /></Field></div>
          <div style={{ flex: 1 }}><Field theme={theme} label="Jam Pulang Default"><TextInput theme={theme} type="time" value={settings.defaultEnd} onChange={(e) => setSettings({ ...settings, defaultEnd: e.target.value })} /></Field></div>
        </div>
        <div style={{ fontSize: 12, fontWeight: 600, color: theme.textMuted, margin: "6px 0" }}>Hari Kerja Default</div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {DAYS_SHORT.map((label, dow) => (
            <button key={dow} onClick={() => toggleWorkDay(dow)} style={{
              width: 42, height: 36, borderRadius: 10, border: `1px solid ${theme.border}`,
              background: settings.defaultWorkDays.includes(dow) ? theme.brand : theme.surfaceAlt,
              color: settings.defaultWorkDays.includes(dow) ? "#04201D" : theme.text, fontWeight: 700, fontSize: 11, cursor: "pointer",
            }}>{label}</button>
          ))}
        </div>
      </Card>

      <SectionTitle theme={theme}>Tarif Default</SectionTitle>
      <Card theme={theme}>
        <Field theme={theme} label="Tarif Kerja Default"><TextInput theme={theme} type="number" value={settings.normalRate} onChange={(e) => setSettings({ ...settings, normalRate: Number(e.target.value) })} /></Field>
        <Field theme={theme} label="Tarif Lembur Default"><TextInput theme={theme} type="number" value={settings.overtimeRate} onChange={(e) => setSettings({ ...settings, overtimeRate: Number(e.target.value) })} /></Field>
      </Card>

      <SectionTitle theme={theme}>Notifikasi</SectionTitle>
      <Card theme={theme} style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ fontSize: 13, fontWeight: 600 }}>Pengingat Aktif</span>
        <Button theme={theme} variant="outline" onClick={() => setSettings({ ...settings, notifEnabled: !settings.notifEnabled })}>{settings.notifEnabled ? "Aktif" : "Nonaktif"}</Button>
      </Card>

      <SectionTitle theme={theme}>Data</SectionTitle>
      <div style={{ display: "flex", gap: 10 }}>
        <Button theme={theme} variant="outline" onClick={() => setShowExport(true)} style={{ flex: 1 }}><Icon name="download" size={15} /> Export Data</Button>
        <Button theme={theme} variant="outline" onClick={() => setShowImport(true)} style={{ flex: 1 }}><Icon name="upload" size={15} /> Import Data</Button>
      </div>

      {showExport && (
        <Modal theme={theme} title="Export Data (JSON)" onClose={() => setShowExport(false)}>
          <div style={{ fontSize: 11, color: theme.textMuted, marginBottom: 8 }}>Salin data di bawah ini sebagai backup.</div>
          <textarea readOnly value={exportData} style={{ ...inputStyle(theme), height: 240, fontFamily: "'JetBrains Mono', monospace", fontSize: 11 }} />
        </Modal>
      )}
      {showImport && (
        <Modal theme={theme} title="Import Data (JSON)" onClose={() => setShowImport(false)} footer={<Button theme={theme} onClick={applyImport} style={{ width: "100%" }}><Icon name="check" size={15} /> Terapkan</Button>}>
          <div style={{ fontSize: 11, color: theme.textMuted, marginBottom: 8 }}>Tempel data JSON hasil export sebelumnya. Ini akan menimpa data saat ini.</div>
          <textarea value={importText} onChange={(e) => setImportText(e.target.value)} placeholder="Tempel JSON di sini" style={{ ...inputStyle(theme), height: 200, fontFamily: "'JetBrains Mono', monospace", fontSize: 11 }} />
        </Modal>
      )}
    </div>
  );
}

/* ============================== MOUNT ============================== */

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<WorkFlowApp />);
</script>
